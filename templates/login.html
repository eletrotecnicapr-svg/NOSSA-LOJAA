
<!DOCTYPE html>

<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Login — Nossa Loja</title>

<link rel="stylesheet"
href="/static/style.css">

</head>

<body>

<main class="login-container">

<div class="login-box">

<h1>🔐 Nossa Loja</h1>

<h2>Painel Administrativo</h2>

{% if erro %}

<div class="erro">
{{ erro }}
</div>

{% endif %}

<form method="POST">

<label>
Usuário
</label>

<input
type="text"
name="usuario"
required
>


<label>
Senha
</label>

<input
type="password"
name="senha"
required
>


<button
class="botao"
type="submit">

Entrar

</button>

</form>

<a href="/">
← Voltar para loja
</a>

</div>

</main>

</body>

</html>
