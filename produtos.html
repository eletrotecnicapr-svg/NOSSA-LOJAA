
<!DOCTYPE html>

<html lang="pt-br">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Produtos — Nossa Loja</title>

<link rel="stylesheet"
href="/static/style.css">

</head>

<body>

<header>

<div class="container">

<h1>🛒 Nossa Loja</h1>

<nav>

<a href="/">Início</a>

<a href="/produtos">Produtos</a>

</nav>

</div>

</header>


<main class="container">

<h2>
Todos os produtos
</h2>


<div class="produtos">

{% for produto in produtos %}

<div class="produto">

{% if produto.imagem_url %}

<img
src="{{ produto.imagem_url }}"
alt="{{ produto.nome }}"
>

{% else %}

<div class="sem-imagem">
📦
</div>

{% endif %}


<div class="produto-conteudo">

<h3>
{{ produto.nome }}
</h3>

<p>
{{ produto.descricao or "" }}
</p>

<a
href="{{ produto.link_afiliado }}"
target="_blank"
rel="nofollow sponsored noopener"
class="botao">

comprar

</a>

</div>

</div>

{% endfor %}

</div>

</main>

</body>

</html>
